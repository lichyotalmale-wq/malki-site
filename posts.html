<script>
class DCLogic{constructor(p){this.props=p||{};this.state={};}setState(o){Object.assign(this.state,o);if(this._onState)this._onState(o);}}

class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const active = s.topic || 'הכל';
const topics = ["הכל", "חרדות ומחשבות", "כעסים וגבולות", "ילדים ורגשות", "מצבי רוח", "אמהות ולחץ"];
const posts = [{"title": "שלוות נפש? אזלה מהמלאי", "topic": "מצבי רוח", "excerpt": "הזמנתי שלוות נפש. כזאת רגילה, לא משהו מיוחד. ומה קיבלתי? מכתב תלונה, ותשובה אחת מפתיעה.", "mins": 3, "href": "post-calm.html"}, {"title": "המדריך הרשמי לאמא מושלמת ומאושרת (אל תוותרי על אף סעיף)", "topic": "אמהות ולחץ", "excerpt": "כל מה שצריך כדי להיות אמא מושלמת: לא לנוח, לא לטעות, ובעיקר לא להרגיש מספיק טובה.", "mins": 3, "href": "post-perfect.html"}, {"title": "למה דווקא כשיש לי סוף סוף שקט, אני לא מצליחה לנוח?", "topic": "חרדות ומחשבות", "excerpt": "דווקא כשהבית סוף סוף שקט, הלב מתחיל לדפוק. למה זה קורה, ואיך מחזירים את השקט?", "mins": 2, "href": "post-rest.html"}, {"title": "עשיתי הכול כדי להרגיע אותה, וזה לא עבד", "topic": "כעסים וגבולות", "excerpt": "ילדה טורקת את הדלת, ואת מנסה הכל: חיבוק, שקט, משהו טעים. ושום דבר לא עובד. למה?", "mins": 4, "href": "post-door.html"}, {"title": "\"אמאאא! אין לי נעל!\"", "topic": "ילדים ורגשות", "excerpt": "שבע וחצי בבוקר, כולם כבר בדלת, ואז מגיע הבכי. למה כל ההסברים הנכונים לא עובדים ברגע הזה?", "mins": 4, "href": "post-shoe.html"}, {"title": "למה לעבוד על החרדה? לא עדיף פשוט להימנע?", "topic": "חרדות ומחשבות", "excerpt": "\"הסתדרתי עד עכשיו, פשוט ברחתי.\" אז למה בכלל לעבוד על זה?", "mins": 3, "href": "post-anxiety.html"}];
const shown = posts.filter(p => active === 'הכל' || p.topic === active).map(p => ({ ...p, minsText: p.mins + ' דקות קריאה' }));
return {
topics: topics.map(t => ({ label: t, on: t === active, off: t !== active, pick: () => this.setState({ topic: t }) })),
posts: shown,
hasPosts: shown.length > 0,
noPosts: shown.length === 0
};
}
}

DCLite.mount(Component, {});
</script>
